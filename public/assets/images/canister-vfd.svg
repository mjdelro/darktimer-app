<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Phosphor Glow Filter -->
    <filter id="vfd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Body Phosphor Gradient (VFD Green) -->
    <linearGradient id="body-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d4a26" stop-opacity="0.30"/>
      <stop offset="28%" stop-color="#22d46a" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#12783c" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#0c4f28" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a381d" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Lid Top Phosphor Gradient (VFD Green) -->
    <linearGradient id="lid-top-fill" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#18964b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0a4221" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <!-- Main VFD Phosphor Graphic -->
  <g filter="url(#vfd-glow)">

