          fill="none" stroke="#39ff88" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Raised Middle Collar -->
    <ellipse cx="256" cy="133" rx="118" ry="37" fill="#0f5c30" fill-opacity="0.22" stroke="#1fd46b" stroke-width="2.2"/>
    <ellipse cx="256" cy="130" rx="114" ry="34" fill="#126e38" fill-opacity="0.32" stroke="#39ff88" stroke-width="2.0"/>

    <!-- 4. Back-Left Pull Tab (behind center cap) -->
